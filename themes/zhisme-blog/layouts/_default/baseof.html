<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="wrapper">
      <main class="page">
        {{ block "main" . }}{{ end }}
      </main>
      <footer>
        {{ partial "footer.html" . }}
      </footer>
    </div>

    <script>
    (function () {
      var btns = document.querySelectorAll(".js-theme-toggle");
      if (!btns.length) return;
      btns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
        });
      });
    })();
    </script>

    {{ if eq hugo.Environment "production" }}
      {{ partial "comment-count.html" . }}

      <!-- GoatCounter Analytics - Privacy-friendly, GDPR compliant, no cookies -->
      <script data-goatcounter="https://zhisme.goatcounter.com/count"
              async src="//gc.zgo.at/count.js"></script>
    {{ end }}
  </body>
</html>
